name: Build and Push Docker Images
on:
  push:
    tags:
      - "backend*"
      - "frontend*"
env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository_owner }}/study-app-api
  FRONTEND_IMAGE_NAME: ${{ github.repository_owner }}/study-app-web
jobs:
  build-and-push-backend:
    name: Build and Push Backend
    runs-on: homelab-runners
    # Only run for backend tags
    if: contains(github.ref, 'backend')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        id: tag
        run: echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./src/backend
          file: ./src/backend/Dockerfile.secured
          push: true
          secrets: |
            nexus_username=${{ secrets.NEXUS_USERNAME }}
            nexus_password=${{ secrets.NEXUS_PASSWORD }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.tag.outputs.TAG }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest

      # Monitor the released image in DependencyTrack. The version projects are created
      # under the devops-study-app parent (managed in milanoid-labs/dependencytrack-config-terraform).
      - name: Generate SBOM
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.tag.outputs.TAG }}
          format: cyclonedx
          output: sbom.cdx.json
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      # Must not block a release if DependencyTrack is down.
      - name: Upload SBOM to DependencyTrack
        continue-on-error: true
        env:
          TAG: ${{ steps.tag.outputs.TAG }}
          DT_API_KEY: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
        run: |
          curl -fsS -X POST http://dependencytrack.milanoid.net/api/v1/bom \
            -H "X-Api-Key: $DT_API_KEY" \
            -F projectName=study-app-api -F projectVersion="${TAG#backend-v}" \
            -F parentName=devops-study-app -F autoCreate=true -F isLatest=true \
            -F bom=@sbom.cdx.json
    outputs:
      tag: ${{ steps.tag.outputs.TAG }}
      app: backend
  build-and-push-frontend:
    name: Build and Push Frontend
    runs-on: homelab-runners
    # Only run for frontend tags
    if: contains(github.ref, 'frontend')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        id: tag
        run: echo "TAG=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./src/frontend
          file: ./src/frontend/Dockerfile.secured
          push: true
          secrets: |
            nexus_username=${{ secrets.NEXUS_USERNAME }}
            nexus_password=${{ secrets.NEXUS_PASSWORD }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.tag.outputs.TAG }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest

      # Monitor the released image in DependencyTrack. The version projects are created
      # under the devops-study-app parent (managed in milanoid-labs/dependencytrack-config-terraform).
      - name: Generate SBOM
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.tag.outputs.TAG }}
          format: cyclonedx
          output: sbom.cdx.json
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      # Must not block a release if DependencyTrack is down.
      - name: Upload SBOM to DependencyTrack
        continue-on-error: true
        env:
          TAG: ${{ steps.tag.outputs.TAG }}
          DT_API_KEY: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
        run: |
          curl -fsS -X POST http://dependencytrack.milanoid.net/api/v1/bom \
            -H "X-Api-Key: $DT_API_KEY" \
            -F projectName=study-app-web -F projectVersion="${TAG#frontend-v}" \
            -F parentName=devops-study-app -F autoCreate=true -F isLatest=true \
            -F bom=@sbom.cdx.json
    outputs:
      tag: ${{ steps.tag.outputs.TAG }}
      app: frontend
